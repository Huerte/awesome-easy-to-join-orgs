name: Link Check

on:
  pull_request:
    paths: ["**.md"]
  push:
    branches: [main]
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lychee:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: lycheeverse/lychee-action@v2
        with:
          args: --no-progress --max-retries 2 --accept 200,201,204,429 --exclude "/(issues|graphs|pull|discussions)" './**/*.md'
          fail: true
